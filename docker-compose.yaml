services:
  backend:
    build: ./server
    image: puttu001/asktube-backend:latest
    ports:
      - "8420:8000"
    env_file:
      - .env
    volumes:
      - ./server/data:/app/data

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:8420
    image: puttu001/asktube-frontend:latest
    ports:
      - "4321:80"
    depends_on:
      - backend
